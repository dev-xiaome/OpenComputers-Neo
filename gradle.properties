# Gradle
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment mappings
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.244
loader_version_range=[1,)

# Mod properties
mod_id=opencomputers_neo
mod_name=OpenComputers Neo
mod_license=MIT
mod_version=1.0.0
mod_group_id=li.cil.oc

# Scala
scala_version=2.13.14
# Porting stage: only compile the already-ported Scala packages (comma separated globs,
# relative to src/main/scala). Add a package here as soon as it is ported, so the project
# stays compilable and launchable at all times.
scala_ported_packages=li/cil/oc/*.scala,li/cil/oc/util/**,li/cil/oc/common/Tier.scala

# Third party libraries
typesafe_config_version=1.4.3
commons_codec_version=1.17.2
luaj_version=3.0.1
