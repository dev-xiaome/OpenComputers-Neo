# Gradle
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment mappings
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.244
loader_version_range=[1,)

# Mod properties
mod_id=opencomputers_neo
mod_name=OpenComputers Neo
mod_license=MIT
mod_version=1.0.0
mod_group_id=li.cil.oc

# Scala
scala_version=2.13.14
# Porting stage: only compile the already-ported Scala packages (comma separated globs,
# relative to src/main/scala). Add a package here as soon as it is ported, so the project
# stays compilable and launchable at all times.
scala_ported_packages=li/cil/oc/*.scala,li/cil/oc/util/**,li/cil/oc/common/Tier.scala,li/cil/oc/common/GuiType.scala,li/cil/oc/common/Sound.scala,li/cil/oc/common/Slot.scala,li/cil/oc/common/PacketType.scala,li/cil/oc/common/PacketBuilder.scala,li/cil/oc/common/PacketHandler.scala,li/cil/oc/common/init/**,li/cil/oc/common/item/**,li/cil/oc/common/Reflection.scala,li/cil/oc/common/ToolDurabilityProviders.scala,li/cil/oc/common/Proxy.scala,li/cil/oc/common/Loot.scala,li/cil/oc/common/IMC.scala,li/cil/oc/common/SaveHandler.scala,li/cil/oc/common/ComponentTracker.scala,li/cil/oc/common/entity/**,li/cil/oc/common/InventorySlots.scala,li/cil/oc/common/command/**,li/cil/oc/common/block/**,li/cil/oc/common/tileentity/**,li/cil/oc/common/inventory/**,li/cil/oc/common/container/**,li/cil/oc/common/template/**,li/cil/oc/common/recipe/**,li/cil/oc/common/component/**,li/cil/oc/common/nanomachines/**,li/cil/oc/common/GuiHandler.scala,li/cil/oc/server/GuiHandler.scala,li/cil/oc/server/fs/**,li/cil/oc/server/machine/**,li/cil/oc/server/network/**,li/cil/oc/server/driver/**,li/cil/oc/server/component/**,li/cil/oc/server/PacketSender.scala,li/cil/oc/server/PacketHandler.scala,li/cil/oc/server/ComponentTracker.scala,li/cil/oc/server/PetVisibility.scala,li/cil/oc/server/agent/ActivationType.scala,li/cil/oc/client/**,li/cil/oc/integration/**,li/cil/oc/common/event/**,li/cil/oc/common/EventHandler.scala,li/cil/oc/common/ClientHooks.scala,li/cil/oc/server/Proxy.scala,li/cil/oc/server/command/**

# Third party libraries
typesafe_config_version=1.4.3
commons_codec_version=1.17.2
luaj_version=3.0.1
